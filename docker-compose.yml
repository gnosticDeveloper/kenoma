services:

  raum-postgres:
    image: postgres:18.1-alpine3.23
    container_name: raum-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raum"]
      interval: 5s
      timeout: 5s
      retries: 5

  raum-db-init:
    image: postgres:18.1-alpine3.23
    container_name: raum-db-init
    depends_on:
      raum-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./services/raum/src/main/resources/init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h raum-postgres -U postgres -d raum -f /init.sql"]

  customer-postgres:
    image: postgres:18.1-alpine3.23
    container_name: customer-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: customerdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: openbao/openbao:2.5.2
    container_name: openbao-dev
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "dev-root-token"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.2
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
      raum-postgres:
        condition: service_healthy
    environment:
      BAO_ADDR: "http://openbao:8200"
      BAO_TOKEN: "dev-root-token"
    volumes:
      - ./scripts/init-openbao.sh:/init-openbao.sh
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    restart: "no"

  raum:
    build:
      context: .
      dockerfile: services/raum/Dockerfile
    container_name: raum
    depends_on:
      raum-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment:
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: postgres
      RAUM_DB_PASSWORD: postgres
      OPENBAO_HOST: http://openbao:8200
      OPENBAO_TOKEN: dev-root-token
      OPENBAO_KV_MOUNT: secret
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  kenoma-init:
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-init
    depends_on:
      raum:
        condition: service_healthy
      customer-postgres:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      RAUM_BASE_URL: http://raum:8080
      CUSTOMER_DB_HOST: customer-postgres
      CUSTOMER_DB_PORT: 5432
      CUSTOMER_DB_NAME: customerdb
      CUSTOMER_DB_USER: admin
      CUSTOMER_DB_PASSWORD: adminpass
      ORG_NAME: "My Organisation"
      ORG_EMAIL: admin@example.com
      ORG_CONTACT: Admin
      SERVICE_NAME: Vassago
      SERVICE_DESC: "Authentication and identity service"
      SEED_USER_NAME: Admin
      SEED_USER_LAST_NAME: User
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_USERNAME: admin
      SEED_USER_PASSWORD: "Ch4ng3me!Dev#"
      ENV_OUT: /out/.env
    volumes:
      - ./scripts/init-kenoma.sh:/init-kenoma.sh
      - ./services/vassago/src/main/resources/users.sql:/users.sql
      - ./.env-out:/out
    entrypoint: ["/bin/sh", "/init-kenoma.sh"]
    restart: "no"

  vassago:
    build:
      context: .
      dockerfile: services/vassago/Dockerfile
    container_name: vassago
    depends_on:
      kenoma-init:
        condition: service_completed_successfully
    env_file:
      - ./.env-out/.env
    environment:
      RAUM_BASE_URL: http://raum:8080
    ports:
      - "8081:8081"
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12