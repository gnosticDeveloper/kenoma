services:
  raum-postgres:
    image: postgres:18.1-alpine3.23
    container_name: raum-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raum"]
      interval: 5s
      timeout: 5s
      retries: 5

  raum-db-init:
    image: postgres:18.1-alpine3.23
    container_name: raum-db-init
    depends_on:
      raum-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./services/raum/src/main/resources/init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h raum-postgres -U postgres -d raum -f /init.sql"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  operational-postgres:
    image: postgres:18.1-alpine3.23
    container_name: operational-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: operationaldb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d operationaldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: openbao/openbao:2.5.2
    container_name: openbao-dev
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "dev-root-token"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.2
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
      raum-postgres:
        condition: service_healthy
    environment:
      BAO_ADDR: "http://openbao:8200"
      BAO_TOKEN: "dev-root-token"
    volumes:
      - ./scripts/init-openbao.sh:/init-openbao.sh
      - approle-out:/approle-out
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    restart: "no"

  kenoma-pre-init:
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-pre-init
    depends_on:
      raum-postgres:
        condition: service_healthy
      operational-postgres:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment:
      OPENBAO_BASE_URL: http://openbao:8200
      OPENBAO_ROOT_TOKEN: dev-root-token
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: postgres
      RAUM_DB_PASSWORD: postgres
      OPERATIONAL_DB_HOST: operational-postgres
      OPERATIONAL_DB_PORT: 5432
      OPERATIONAL_DB_NAME: operationaldb
      OPERATIONAL_DB_USER: admin
      OPERATIONAL_DB_PASSWORD: adminpass
      OPERATOR_NAME: Platform
      OPERATOR_LAST_NAME: Operator
      OPERATOR_EMAIL: operator@internal
      OPERATOR_USERNAME: platform_operator
      OPERATOR_PASSWORD: "Ch4ng3me!Ops#"
      ENV_OUT: /out/.env
    volumes:
      - ./scripts/kenoma-pre-init.sh:/kenoma-pre-init.sh
      - ./services/vassago/src/main/resources/users.sql:/users.sql
      - ./.env-out:/out
      - approle-out:/approle-out
    entrypoint: ["/bin/sh", "/kenoma-pre-init.sh"]
    restart: "no"

  raum:
    build:
      context: .
      dockerfile: services/raum/Dockerfile
    container_name: raum
    depends_on:
      raum-postgres:
        condition: service_healthy

      openbao:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      kenoma-pre-init:
        condition: service_completed_successfully
    environment:
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: postgres
      RAUM_DB_PASSWORD: postgres
      OPENBAO_HOST: http://openbao:8200
      OPENBAO_TOKEN: dev-root-token
      OPENBAO_KV_MOUNT: secret
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  vassago:
    build:
      context: .
      dockerfile: services/vassago/Dockerfile
    container_name: vassago
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      RAUM_BASE_URL: http://raum:8080
      OPENBAO_BASE_URL: http://openbao:8200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "8081:8081"
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  kenoma-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-seed
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      operational-postgres:
        condition: service_healthy
    environment:
      OPERATIONAL_DB_HOST: operational-postgres
      OPERATIONAL_DB_PORT: 5432
      OPERATIONAL_DB_NAME: operationaldb
      OPERATIONAL_DB_USER: admin
      OPERATIONAL_DB_PASSWORD: adminpass
      SEED_USER_NAME: Admin
      SEED_USER_LAST_NAME: User
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_USERNAME: admin
      SEED_USER_PASSWORD: "Ch4ng3me!Dev#"
    volumes:
      - ./scripts/seed-kenoma.sh:/seed-kenoma.sh
      - ./.env-out:/env-out
      - approle-out:/approle-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && /bin/sh /seed-kenoma.sh"]
    restart: "no"

volumes:
  approle-out: