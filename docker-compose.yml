services:
  # The three databases are kept as separate containers to enforce tenant isolation during
  # development and testing. In production they can share a single PostgreSQL instance.
  raum-postgres:
    image: postgres:18.1-alpine3.23
    container_name: raum-postgres
    environment:
      POSTGRES_USER: ${RAUM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      POSTGRES_DB: raum
    ports:
      - "5432:5432"
    volumes:
      - raum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAUM_DB_USER:-postgres} -d raum"]
      interval: 5s
      timeout: 5s
      retries: 5

  raum-db-init:
    image: postgres:18.1-alpine3.23
    container_name: raum-db-init
    depends_on:
      raum-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${RAUM_DB_PASSWORD:-postgres}
    volumes:
      - ./services/raum/src/main/resources/init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h raum-postgres -U ${RAUM_DB_USER:-postgres} -d raum -f /init.sql"]

  bime-postgres:
    image: postgres:18.1-alpine3.23
    container_name: bime-postgres
    environment:
      POSTGRES_USER: ${BIME_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BIME_DB_PASSWORD:-postgres}
      POSTGRES_DB: bime
    ports:
      - "5434:5432"
    volumes:
      - bime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BIME_DB_USER:-postgres} -d bime"]
      interval: 5s
      timeout: 5s
      retries: 5

  bime-db-init:
    image: postgres:18.1-alpine3.23
    container_name: bime-db-init
    depends_on:
      bime-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${BIME_DB_PASSWORD:-postgres}
    volumes:
      - ./services/common/src/main/resources/bime-init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h bime-postgres -U ${BIME_DB_USER:-postgres} -d bime -f /init.sql"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vassago-postgres:
    image: postgres:18.1-alpine3.23
    container_name: vassago-postgres
    environment:
      POSTGRES_USER: ${VASSAGO_DB_USER:-admin}
      POSTGRES_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      POSTGRES_DB: vassago
    ports:
      - "5433:5432"
    volumes:
      - vassago-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VASSAGO_DB_USER:-admin} -d vassago"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: openbao/openbao:2.5.2
    container_name: openbao
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server
    volumes:
      - openbao-data:/openbao/file
      - ./config/openbao:/openbao/config:ro
      - openbao-init-out:/init-out
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/seal-status"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.2
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
      raum-postgres:
        condition: service_healthy
    environment:
      BAO_ADDR: "http://openbao:8200"
    volumes:
      - ./scripts/init-openbao.sh:/init-openbao.sh
      - approle-out:/approle-out
      - openbao-init-out:/init-out
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    restart: "no"

  kenoma-pre-init:
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-pre-init
    depends_on:
      raum-postgres:
        condition: service_healthy
      vassago-postgres:
        condition: service_healthy
      bime-postgres:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      bime-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment:
      OPENBAO_BASE_URL: http://openbao:8200
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: ${RAUM_DB_USER:-postgres}
      RAUM_DB_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      VASSAGO_DB_HOST: vassago-postgres
      VASSAGO_DB_PORT: 5432
      VASSAGO_DB_NAME: vassago
      VASSAGO_DB_USER: ${VASSAGO_DB_USER:-admin}
      VASSAGO_DB_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      BIME_DB_HOST: bime-postgres
      BIME_DB_PORT: 5432
      BIME_DB_NAME: bime
      BIME_DB_USER: ${BIME_DB_USER:-postgres}
      BIME_DB_PASSWORD: ${BIME_DB_PASSWORD:-postgres}
      OPERATOR_NAME: ${OPERATOR_NAME:-Platform}
      OPERATOR_LAST_NAME: ${OPERATOR_LAST_NAME:-Operator}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operator@internal}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-platform_operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-Ch4ng3me!Ops#}
      ENV_OUT: /out/.env
    volumes:
      - ./scripts/kenoma-pre-init.sh:/kenoma-pre-init.sh
      - ./services/common/src/main/resources/users.sql:/users.sql
      - ./.env-out:/out
      - approle-out:/approle-out
      - openbao-init-out:/init-out
    entrypoint: ["/bin/sh", "/kenoma-pre-init.sh"]
    restart: "no"

  raum:
    build:
      context: .
      dockerfile: services/raum/Dockerfile
    container_name: raum
    depends_on:
      raum-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      kenoma-pre-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: ${RAUM_DB_USER:-postgres}
      RAUM_DB_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      OPENBAO_HOST: http://openbao:8200
      OPENBAO_KV_MOUNT: secret
      VASSAGO_BASE_URL: http://vassago:8081
      BIME_BASE_URL: http://bime:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  vassago:
    build:
      context: .
      dockerfile: services/vassago/Dockerfile
    container_name: vassago
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      RAUM_BASE_URL: http://raum:8080
      OPENBAO_BASE_URL: http://openbao:8200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      VASSAGO_COOKIE_DOMAIN: ${VASSAGO_COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "5006:5006"
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  bime:
    build:
      context: .
      dockerfile: services/bime/Dockerfile
    container_name: bime
    depends_on:
      bime-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      bime-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      kenoma-pre-init:
        condition: service_completed_successfully
      raum:
        condition: service_healthy
    environment:
      OPENBAO_HOST: http://openbao:8200
      RAUM_BASE_URL: http://raum:8080
      VASSAGO_BASE_URL: http://vassago:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "5007:5007"
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:alpine
    container_name: nginx
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      raum:
        condition: service_healthy
      vassago:
        condition: service_healthy
      bime:
        condition: service_healthy

  kenoma-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-seed
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      vassago-postgres:
        condition: service_healthy
    environment:
      VASSAGO_DB_HOST: vassago-postgres
      VASSAGO_DB_PORT: 5432
      VASSAGO_DB_NAME: vassago
      VASSAGO_DB_USER: ${VASSAGO_DB_USER:-admin}
      VASSAGO_DB_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      SEED_USER_NAME: ${SEED_USER_NAME:-Admin}
      SEED_USER_LAST_NAME: ${SEED_USER_LAST_NAME:-User}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-admin}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Ch4ng3me!Dev#}
    volumes:
      - ./scripts/seed-kenoma.sh:/seed-kenoma.sh
      - ./.env-out:/env-out
      - approle-out:/approle-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && /bin/sh /seed-kenoma.sh"]
    restart: "no"

volumes:
  approle-out:
  openbao-data:
  openbao-init-out:
  raum-postgres-data:
  bime-postgres-data:
  vassago-postgres-data:
