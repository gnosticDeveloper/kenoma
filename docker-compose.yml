services:
  # The three databases are kept as separate containers to enforce tenant isolation during
  # development and testing. In production, they can share a single PostgreSQL instance.
  #
  # Dependency note (toward multi-host distributability): the one-shot init containers'
  # `depends_on` on postgres/redis/openbao readiness are single-host-only by construction
  # (Compose can't express "wait for a service on another machine"), but they're low-risk to
  # keep as-is — the init scripts already retry-loop against their targets (e.g.
  # scripts/init-openbao.sh's `until wget ...`) rather than assuming Compose ordering alone,
  # and all hostnames are already parameterized via env vars. The long-running services'
  # `depends_on` on each other (raum/vassago/bime waiting on their DB/redis/openbao/each other)
  # are a heavier single-host crutch: none of the three retry their initial DB/redis/OpenBao
  # connection, so they fail fast at boot if a dependency isn't ready yet. Relaxing those
  # further requires adding startup retry/backoff in the services themselves — out of scope
  # here, tracked as follow-up work.
  raum-postgres:
    image: postgres:18.1-alpine3.23
    container_name: raum-postgres
    environment:
      POSTGRES_USER: ${RAUM_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      POSTGRES_DB: raum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAUM_DB_USER:-postgres} -d raum"]
      interval: 5s
      timeout: 5s
      retries: 5

  raum-db-init:
    image: postgres:18.1-alpine3.23
    container_name: raum-db-init
    depends_on:
      raum-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${RAUM_DB_PASSWORD:-postgres}
    volumes:
      - ./services/raum/src/main/resources/init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h raum-postgres -U ${RAUM_DB_USER:-postgres} -d raum -f /init.sql"]

  bime-postgres:
    image: postgres:18.1-alpine3.23
    container_name: bime-postgres
    environment:
      POSTGRES_USER: ${BIME_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BIME_DB_PASSWORD:-postgres}
      POSTGRES_DB: bime
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BIME_DB_USER:-postgres} -d bime"]
      interval: 5s
      timeout: 5s
      retries: 5

  bime-db-init:
    image: postgres:18.1-alpine3.23
    container_name: bime-db-init
    depends_on:
      bime-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${BIME_DB_PASSWORD:-postgres}
    volumes:
      - ./services/common/src/main/resources/bime-init.sql:/init.sql
    entrypoint: ["sh", "-c", "psql -h bime-postgres -U ${BIME_DB_USER:-postgres} -d bime -f /init.sql"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vassago-postgres:
    image: postgres:18.1-alpine3.23
    container_name: vassago-postgres
    environment:
      POSTGRES_USER: ${VASSAGO_DB_USER:-admin}
      POSTGRES_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      POSTGRES_DB: vassago
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vassago-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VASSAGO_DB_USER:-admin} -d vassago"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: openbao/openbao:2.5.2
    container_name: openbao
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    command: server
    volumes:
      - openbao-data:/openbao/file
      - ./config/openbao:/openbao/config:ro
      - openbao-init-out:/init-out
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/seal-status"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.2
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
      raum-postgres:
        condition: service_healthy
    environment:
      BAO_ADDR: "http://openbao:8200"
    volumes:
      - ./scripts/init-openbao.sh:/init-openbao.sh
      - approle-out:/approle-out
      - openbao-init-out:/init-out
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    restart: "no"

  kenoma-pre-init:
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-pre-init
    depends_on:
      raum-postgres:
        condition: service_healthy
      vassago-postgres:
        condition: service_healthy
      bime-postgres:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      bime-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    environment:
      OPENBAO_BASE_URL: http://openbao:8200
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: ${RAUM_DB_USER:-postgres}
      RAUM_DB_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      VASSAGO_DB_HOST: vassago-postgres
      VASSAGO_DB_PORT: 5432
      VASSAGO_DB_NAME: vassago
      VASSAGO_DB_USER: ${VASSAGO_DB_USER:-admin}
      VASSAGO_DB_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      BIME_DB_HOST: bime-postgres
      BIME_DB_PORT: 5432
      BIME_DB_NAME: bime
      BIME_DB_USER: ${BIME_DB_USER:-postgres}
      BIME_DB_PASSWORD: ${BIME_DB_PASSWORD:-postgres}
      OPERATOR_NAME: ${OPERATOR_NAME:-Platform}
      OPERATOR_LAST_NAME: ${OPERATOR_LAST_NAME:-Operator}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operator@internal}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-platform_operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-Ch4ng3me!Ops#}
      KENOMA_INIT_MODE: ${KENOMA_INIT_MODE:-seeded}
      DR_BACKUP_S3_ENDPOINT: ${DR_BACKUP_S3_ENDPOINT:-}
      DR_BACKUP_S3_BUCKET: ${DR_BACKUP_S3_BUCKET:-}
      DR_BACKUP_S3_ACCESS_KEY: ${DR_BACKUP_S3_ACCESS_KEY:-}
      DR_BACKUP_S3_SECRET_KEY: ${DR_BACKUP_S3_SECRET_KEY:-}
      ENV_OUT: /out/.env
    volumes:
      - ./scripts/kenoma-pre-init.sh:/kenoma-pre-init.sh
      - ./services/common/src/main/resources/users.sql:/users.sql
      - ./.env-out:/out
      - approle-out:/approle-out
      - openbao-init-out:/init-out
    entrypoint: ["/bin/sh", "/kenoma-pre-init.sh"]
    restart: "no"

  raum:
    build:
      context: .
      dockerfile: services/raum/Dockerfile
    container_name: raum
    depends_on:
      raum-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      raum-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      kenoma-pre-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      RAUM_DB_HOST: raum-postgres
      RAUM_DB_PORT: 5432
      RAUM_DB_NAME: raum
      RAUM_DB_USER: ${RAUM_DB_USER:-postgres}
      RAUM_DB_PASSWORD: ${RAUM_DB_PASSWORD:-postgres}
      OPENBAO_HOST: http://openbao:8200
      OPENBAO_KV_MOUNT: secret
      VASSAGO_BASE_URL: http://vassago:8081
      BIME_BASE_URL: http://bime:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      MAILGUN_INVOICE_FROM: ${MAILGUN_INVOICE_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FX_PROVIDER_API_KEY: ${FX_PROVIDER_API_KEY:-}
      FX_PROVIDER_BASE_URL: ${FX_PROVIDER_BASE_URL:-https://v6.exchangerate-api.com/v6}
      FX_REFRESH_CRON: ${FX_REFRESH_CRON:-0 0 5 * * *}
      DR_BACKUP_CRON: ${DR_BACKUP_CRON}
      JAVA_TOOL_OPTIONS: ${RAUM_JDWP_OPTS:-}
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "127.0.0.1:5005:5005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  vassago:
    build:
      context: .
      dockerfile: services/vassago/Dockerfile
    container_name: vassago
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      RAUM_BASE_URL: http://raum:8080
      OPENBAO_BASE_URL: http://openbao:8200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      VASSAGO_COOKIE_DOMAIN: ${VASSAGO_COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: ${VASSAGO_JDWP_OPTS:-}
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "127.0.0.1:5006:5006"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  bime:
    build:
      context: .
      dockerfile: services/bime/Dockerfile
    container_name: bime
    depends_on:
      bime-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      bime-db-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      kenoma-pre-init:
        condition: service_completed_successfully
      raum:
        # Bime only calls Raum lazily at request time (see ConnectionPoolService), never
        # synchronously at boot, so waiting for full health rather than just process start
        # is an unnecessary single-host coupling.
        condition: service_started
    environment:
      OPENBAO_HOST: http://openbao:8200
      RAUM_BASE_URL: http://raum:8080
      VASSAGO_BASE_URL: http://vassago:8081
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      MAILGUN_STOCK_ALERT_FROM: ${MAILGUN_STOCK_ALERT_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_TOOL_OPTIONS: ${BIME_JDWP_OPTS:-}
    volumes:
      - ./.env-out:/env-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && java -jar app.jar"]
    ports:
      - "127.0.0.1:5007:5007"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:alpine
    container_name: nginx
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      raum:
        condition: service_healthy
      vassago:
        condition: service_healthy
      bime:
        condition: service_healthy
      grafana:
        condition: service_started

  kenoma-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: scripts/dev/db/Dockerfile
    container_name: kenoma-seed
    depends_on:
      kenoma-pre-init:
        condition: service_completed_successfully
      vassago-postgres:
        condition: service_healthy
    environment:
      VASSAGO_DB_HOST: vassago-postgres
      VASSAGO_DB_PORT: 5432
      VASSAGO_DB_NAME: vassago
      VASSAGO_DB_USER: ${VASSAGO_DB_USER:-admin}
      VASSAGO_DB_PASSWORD: ${VASSAGO_DB_PASSWORD:-adminpass}
      SEED_USER_NAME: ${SEED_USER_NAME:-Admin}
      SEED_USER_LAST_NAME: ${SEED_USER_LAST_NAME:-User}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-admin}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Ch4ng3me!Dev#}
    volumes:
      - ./scripts/seed-kenoma.sh:/seed-kenoma.sh
      - ./.env-out:/env-out
      - approle-out:/approle-out
    entrypoint: ["sh", "-c", "export $(cat /env-out/.env | xargs) && /bin/sh /seed-kenoma.sh"]
    restart: "no"

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    # Reads only this node's local Docker socket/log files and pushes over the network to
    # the central Loki service, so it's a per-node agent by design, not a bottleneck under
    # Swarm scale-out. Once this repo actually runs as a Swarm stack (`docker stack deploy`,
    # which it does not yet — see prometheus.yml), this service wants `deploy: mode: global`
    # so every node runs its own copy; `container_name` is incompatible with that (Swarm
    # ignores it, but drop it at that point to avoid confusion) and is only kept here because
    # today this is still a plain single-host Compose file.
    image: grafana/promtail:3.3.2
    container_name: promtail
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    # Fronted by nginx at https://grafana.${BASE_DOMAIN} (see gateway/nginx.conf.template),
    # same as raum/vassago/bime not publishing their own app ports directly — no host port
    # mapping here on purpose.
    image: grafana/grafana:13.1.3
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://grafana.${BASE_DOMAIN:-localhost}/
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  approle-out:
  openbao-data:
  openbao-init-out:
  raum-postgres-data:
  bime-postgres-data:
  vassago-postgres-data:
  loki-data:
  prometheus-data:
  grafana-data:
