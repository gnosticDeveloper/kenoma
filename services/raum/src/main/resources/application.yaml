spring:
  application:
    name: raum
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  r2dbc:
    url: r2dbc:postgresql://${RAUM_DB_HOST:localhost}:${RAUM_DB_PORT:5432}/${RAUM_DB_NAME:raum}
    username: ${RAUM_DB_USER:postgres}
    password: ${RAUM_DB_PASSWORD:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

openbao:
  host: ${OPENBAO_HOST:http://localhost:8200}
  provisioner:
    role-id: ${RAUM_PROVISIONER_ROLE_ID}
    secret-id: ${RAUM_PROVISIONER_SECRET_ID}
    max-attempts: ${RAUM_OPENBAO_PROVISIONER_MAX_ATTEMPTS:10}
  kv:
    mount: ${OPENBAO_KV_MOUNT:secret}
  token-renewal-rate-ms: ${OPENBAO_TOKEN_RENEWAL_RATE_MS:1200000}
server:
  port: 8080
vassago:
  base-url: ${VASSAGO_BASE_URL:http://localhost:8081}
  service-id: ${VASSAGO_SERVICE_ID}
  jwt:
    public-key-refresh-cron: ${VASSAGO_JWT_PUBLIC_KEY_REFRESH_CRON:15 0 0 * * *}

raum:
  service-id: ${RAUM_SERVICE_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

bime:
  base-url: ${BIME_BASE_URL:http://localhost:8082}
  service-id: ${BIME_SERVICE_ID}

raum.onboarding:
  retry-cron: ${ONBOARDING_RETRY_CRON:0 */10 * * * *}
  config-ttl-seconds: ${ONBOARDING_CONFIG_TTL_SECONDS:86400}