spring:
  application:
    name: vassago
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
raum:
  base-url: ${RAUM_BASE_URL:http://localhost:8080}
vassago:
  service-id: ${VASSAGO_SERVICE_ID}
  openbao:
    provisioner:
      role-id: ${VASSAGO_PROVISIONER_ROLE_ID}
      secret-id: ${VASSAGO_PROVISIONER_SECRET_ID}
    token-renewal-rate-ms: ${VASSAGO_OPENBAO_TOKEN_RENEWAL_RATE_MS:1200000}
  pool:
    expiry-buffer-percent: ${VASSAGO_POOL_EXPIRY_BUFFER_PERCENT:10}
    eviction-interval-seconds: ${VASSAGO_POOL_EVICTION_INTERVAL_SECONDS:60}
    max-size: ${VASSAGO_POOL_MAX_SIZE:10}
    initial-size: ${VASSAGO_POOL_INITIAL_SIZE:2}
  jwt:
    transit-key-name: ${VASSAGO_JWT_TRANSIT_KEY_NAME:vassago-jwt}
    ttl-seconds: ${VASSAGO_JWT_TTL_SECONDS:300}
    key-rotation-cron: ${VASSAGO_JWT_KEY_ROTATION_CRON:0 0 0 * * *}
  refresh-token:
    ttl-seconds: ${VASSAGO_REFRESH_TOKEN_TTL_SECONDS:2592000}
  cookie:
    domain: ${VASSAGO_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
openbao:
  base-url: ${OPENBAO_BASE_URL:http://localhost:8200}
mailgun:
  api-key: ${MAILGUN_API_KEY}
  domain: ${MAILGUN_DOMAIN}
  from: ${MAILGUN_FROM:noreply@${mailgun.domain}}
app:
  # this is meant for a future frontend application
  base-url: ${APP_BASE_URL:http://localhost:3000}