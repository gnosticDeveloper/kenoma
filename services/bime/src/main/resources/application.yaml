spring:
  application:
    name: bime

openbao:
  host: ${OPENBAO_HOST:http://localhost:8200}
  token: ${OPENBAO_TOKEN:dev-root-token}

server:
  port: 8082

raum:
  base-url: ${RAUM_BASE_URL:http://localhost:8080}

bime:
  service-id: ${BIME_SERVICE_ID}
  pool:
    expiry-buffer-percent: ${BIME_POOL_EXPIRY_BUFFER_PERCENT:10}
    eviction-interval-seconds: ${BIME_POOL_EVICTION_INTERVAL_SECONDS:60}
    max-size: ${BIME_POOL_MAX_SIZE:10}
    initial-size: ${BIME_POOL_INITIAL_SIZE:2}
  jwt:
    transit-key-name: ${BIME_JWT_TRANSIT_KEY_NAME:vassago-jwt}
