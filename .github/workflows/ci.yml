name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: mvn test -pl services/common,services/raum,services/vassago -am -Dspring.profiles.active=test
        env:
          VASSAGO_SERVICE_ID: 00000000-0000-0000-0000-000000000001

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Raum image
        run: docker build -f services/raum/Dockerfile -t kenoma-raum:latest .

      - name: Run integration tests
        run: ./mvnw verify -pl services/raum,services/vassago -am -Dspring.profiles.active=test
        env:
          VASSAGO_SERVICE_ID: 00000000-0000-0000-0000-000000000001