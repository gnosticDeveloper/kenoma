apiVersion: 1

groups:
  - orgId: 1
    name: kenoma-service-health
    folder: Kenoma
    interval: 1m
    rules:
      - uid: kenoma-service-down
        title: Service down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has been unreachable for 2+ minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job=~"raum|vassago|bime"}
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: kenoma-high-5xx-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        # No 5xx responses yet means the counter series doesn't exist at all, not that
        # it's zero — that's "no data", not "no problem", but it's also not alertable.
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is returning an elevated rate of 5xx responses"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: kenoma-high-5xx-rate-by-endpoint
        title: High 5xx error rate on a specific endpoint
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} {{ $labels.uri }} is returning an elevated rate of 5xx responses — narrower than the aggregate rule, meant for pinpointing which route is failing"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (job, uri) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: kenoma-jvm-heap-warning
        title: JVM heap usage elevated
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap usage above 70% — worth planning capacity ahead of the critical threshold"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.7] }

      - uid: kenoma-jvm-heap-critical
        title: JVM heap usage critical
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} heap usage above 95% — scale up soon, OOM risk is imminent"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.95] }

deleteRules:
  - orgId: 1
    uid: kenoma-jvm-heap-pressure
